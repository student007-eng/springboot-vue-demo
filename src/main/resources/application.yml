server:
  servlet:
    context-path: /           #项目的访问根路径
  port: 8080
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pdm?characterEncoding=UTF-8&&serverTimezone=GMT
    username: root
    password: 070818
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5                    #连接池启动时，一次性预先创建多少个连接放入池子
      min-idle: 10                       #池子里面最少要维持多少个空闲连接
      max-wait: 60000                    #当池子里面所有连接都被拿光（达到 max-active），新来的业务线程排队等待拿连接的最长时间
      validation-query: SELECT 1         #连接有效性检测参数（探活，判断连接是不是已经断了）
      test-on-borrow: true               #每次从池子取出连接的时候，执行 validation-query 校验
      test-while-idle: true              #后台空闲扫描线程（eviction 线程）扫描空闲连接的时候，顺便探活
      test-on-return: false              #业务用完连接、归还回池子的时候，校验连接,默认false
# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ur.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    group: 'dafault'
    paths-to-match: '/**'
    package-to-scan: com.example.controller
knife4j:
  enable: true
  setting:
    language: zh_cn
    swagger-model-name: 实体类列表
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl #在控制台打印真实的SQL语句
  type-aliases-package: com.example.entity  #告诉 MyBatis-Plus 去哪里扫描实体类，并自动给它们起个简短的别名